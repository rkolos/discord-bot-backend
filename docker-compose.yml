services:
  # --- Infrastructure (Databases) ---
  postgres:
    image: postgres:15-alpine
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sn-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sn}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - sn-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-default}
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - sn-network
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # --- Applications (Services) ---
  # Frontend API — public; Discord OAuth, port 3001 for login/callback
  frontend-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    env_file: .env
    environment:
      NODE_ENV: development
      PORT: 3001
      FRONTEND_API_URL: http://localhost:3001
      POSTGRES_HOST: postgres
      DB_HOST: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CLICKHOUSE_HOST: clickhouse
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3001:3001"
    command: npm run ${NEST_START_CMD:-start:dev} -- frontend-api
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      clickhouse: { condition: service_started }
    networks:
      - sn-network

  # Admin API — port 3002; in prod access only via VPN
  admin-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    env_file: .env
    environment:
      NODE_ENV: development
      PORT: 3002
      ADMIN_API_URL: http://localhost:3002
      POSTGRES_HOST: postgres
      DB_HOST: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CLICKHOUSE_HOST: clickhouse
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3002:3002"
    command: npm run ${NEST_START_CMD:-start:dev} -- admin-api
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      clickhouse: { condition: service_started }
    networks:
      - sn-network

  bot-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    env_file: .env
    environment:
      NODE_ENV: development
      POSTGRES_HOST: postgres
      DB_HOST: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CLICKHOUSE_HOST: clickhouse
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run ${NEST_START_CMD:-start:dev} -- bot-service
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      clickhouse: { condition: service_started }
    networks:
      - sn-network

  ingestor-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    env_file: .env
    environment:
      NODE_ENV: development
      POSTGRES_HOST: postgres
      DB_HOST: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CLICKHOUSE_HOST: clickhouse
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run ${NEST_START_CMD:-start:dev} -- ingestor-worker
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      clickhouse: { condition: service_started }
    networks:
      - sn-network

  background-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    env_file: .env
    environment:
      NODE_ENV: development
      POSTGRES_HOST: postgres
      DB_HOST: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run ${NEST_START_CMD:-start:dev} -- background-worker
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks:
      - sn-network

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:

networks:
  sn-network:
    driver: bridge
