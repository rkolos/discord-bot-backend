# Только инфраструктура (БД) — для локального запуска API на хосте.
# Использование:
#   docker compose -f docker-compose.infra.yml up -d
#   npm run start:dev:frontend-api   # в отдельном терминале
#   npm run start:dev:admin-api      # в отдельном терминале
# В .env для локального запуска: POSTGRES_HOST=localhost, REDIS_HOST=localhost, REDIS_PORT=6380, CLICKHOUSE_HOST=localhost
services:
  postgres:
    image: postgres:15-alpine
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sn-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sn}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - sn-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-default}
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - sn-network
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:

networks:
  sn-network:
    driver: bridge
